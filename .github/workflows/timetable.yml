name: Timetable sync

# 時間割の自動同期（4:00〜24:00 JST、5分おき）
#   1. シートのhtmlviewを取得 → 時間割画像を抽出
#   2. 画像バイトのハッシュを前回分と比較（トークンは回転するためURL比較不可）
#   3. 差分があれば public/timetable/ に上書きコミット → Pagesが自動再デプロイ
#   4. FIREBASE_SERVICE_ACCOUNT_JSON があれば購読者へWeb Push一斉送信
#
# 新規連携サービスなし。PublicリポジトリなのでActions分数は無料。

on:
  schedule:
    # UTC 19-23,0-15 = JST 4:00-24:00。GitHub cronはUTC指定。
    - cron: "*/5 19-23,0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable-sync
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests google-auth

      - name: Sync timetable
        id: sync
        run: python .github/scripts/timetable_sync.py
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Commit on change
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add public/timetable
          git commit -m "時間割を更新 ($(date '+%Y-%m-%d %H:%M'))"
          git push
