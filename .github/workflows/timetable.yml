name: Timetable sync

# 時間割の自動同期（4:00〜24:00 JST、15分おき）
#   1. シートのhtmlviewを取得 → 時間割画像を抽出
#   2. 画像バイトのハッシュを前回分と比較（トークンは回転するためURL比較不可）
#   3. 差分があれば public/timetable/ に上書きコミット → Pagesが自動再デプロイ
#   4. FIREBASE_SERVICE_ACCOUNT_JSON があれば購読者へWeb Push一斉送信
#
# 新規連携サービスなし。PublicリポジトリなのでActions分数は無料。
# 注意: schedule実行はデフォルトブランチ（main）にマージ後に有効になる。

on:
  schedule:
    # JST 4:00-24:00（= UTC 前日19:00〜当日15:00）に15分おき。GitHub cronはUTC指定。
    # 時間帯は2行に分ける（1行のカンマリストだと起動しない事例があるため）。
    # 5分おき（*/5）だとGitHub Actionsのスケジューラー制限で遅延・スキップが多発するため15分おきに設定。
    - cron: "*/15 19-23 * * *"
    - cron: "*/15 0-15 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "差分がなくてもPush送信をテストする"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: timetable-sync
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install deps
        run: pip install -r .github/scripts/requirements.txt

      - name: Sync timetable
        id: sync
        run: python .github/scripts/timetable_sync.py
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}

      - name: Commit on change
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add public/timetable
          git commit -m "時間割を更新 ($(date '+%Y-%m-%d %H:%M'))"
          # 手動dispatchの重なり等で先に進んでいた場合に備えて取り込んでからpush
          git pull --rebase
          git push
